---
fullnameOverride: airflow

defaultAirflowRepository: 025064823138.dkr.ecr.eu-central-1.amazonaws.com/poc-datapipeline/airflow-dags
defaultAirflowTag: local-ltshb-b8c5159

apiSecretKeySecretName: airflow-api-secret-key
jwtSecretName: airflow-jwt-secret
fernetKeySecretName: airflow-fernet-key

dagInitContainerImage:
  repository: 025064823138.dkr.ecr.eu-central-1.amazonaws.com/poc-datapipeline/airflow-dags-only
  tag: init-local-ltshb-5e46c7c
  pullPolicy: IfNotPresent

airflowServiceAccountRoleArn: arn:aws:iam::025064823138:role/k8s-service-account/K8sIRSAAirflowDBSecretSwissgeoPocDatapipeline

# Base on https://airflow.apache.org/docs/helm-chart/stable/index.html#installing-the-helm-chart-with-argo-cd-flux-rancher-or-terraform
createUserJob:
  useHelmHooks: false
  applyCustomEnv: false
  defaultUser:
    password: "$(AIRFLOW_ADMIN_PASSWORD)"
  env:
    - name: AIRFLOW_ADMIN_PASSWORD
      valueFrom:
        secretKeyRef:
          name: airflow-admin-password
          key: password
  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: "{{ .Values.airflowServiceAccountRoleArn }}"

migrateDatabaseJob:
  useHelmHooks: false
  applyCustomEnv: false
  # Automate database migration with Argo CD (optional)
  jobAnnotations:
    "argocd.argoproj.io/hook": Sync
  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: "{{ .Values.airflowServiceAccountRoleArn }}"

# recommendation from the doc
useStandardNaming: true

executor: KubernetesExecutor

# See https://airflow.apache.org/docs/helm-chart/stable/airflow-configuration.html#configuring-airflow
config:
  api:
    expose_config: 'True'
    base_url: https://nlb-poc-datapipeline.poc-datapipeline.sgdi.tech/airflow
  kubernetes_executor:
    delete_worker_pods: 'False'
    delete_worker_pods_on_failure: 'False'

# do not create persistent volumes for logs
logs:
  persistence:
    enabled: false

# Mounting the SecretProviderClass triggers the Secrets Store CSI driver to
# synchronize its secretObjects, including airflow-db-secret.
volumes:
  - name: aws-secrets-airflow
    csi:
      driver: secrets-store.csi.k8s.io
      readOnly: true
      volumeAttributes:
        secretProviderClass: aws-secrets-airflow

volumeMounts:
  - name: aws-secrets-airflow
    mountPath: /mnt/secrets-store/aws-secrets-airflow
    readOnly: true

apiServer:
  annotations:
    reloader.stakater.com/auto: "true"
  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: "{{ .Values.airflowServiceAccountRoleArn }}"

scheduler:
  annotations:
    reloader.stakater.com/auto: "true"
  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: "{{ .Values.airflowServiceAccountRoleArn }}"

webserver:
  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: "{{ .Values.airflowServiceAccountRoleArn }}"

triggerer:
  annotations:
    reloader.stakater.com/auto: "true"
  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: "{{ .Values.airflowServiceAccountRoleArn }}"
  env:
    - name: PYTHONPATH
      value: /opt/airflow/dags/local-airflow-dag-init-container/python
  extraVolumes:
    - name: dags
      emptyDir: {}
  extraVolumeMounts:
    - name: dags
      mountPath: /opt/airflow/dags
      readOnly: true
  extraInitContainers:
    - name: dag-init
      image: "{{ .Values.dagInitContainerImage.repository }}:{{ .Values.dagInitContainerImage.tag }}"
      imagePullPolicy: "{{ .Values.dagInitContainerImage.pullPolicy }}"
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        readOnlyRootFilesystem: true
      volumeMounts:
        - name: dags
          mountPath: /opt/airflow/dags

dagProcessor:
  annotations:
    reloader.stakater.com/auto: "true"
  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: "{{ .Values.airflowServiceAccountRoleArn }}"
  env:
    - name: PYTHONPATH
      value: /opt/airflow/dags/local-airflow-dag-init-container/python
  extraVolumes:
    - name: dags
      emptyDir: {}
  extraVolumeMounts:
    - name: dags
      mountPath: /opt/airflow/dags
      readOnly: true
  extraInitContainers:
    - name: dag-init
      image: "{{ .Values.dagInitContainerImage.repository }}:{{ .Values.dagInitContainerImage.tag }}"
      imagePullPolicy: "{{ .Values.dagInitContainerImage.pullPolicy }}"
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        readOnlyRootFilesystem: true
      volumeMounts:
        - name: dags
          mountPath: /opt/airflow/dags

cleanup:
  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: "{{ .Values.airflowServiceAccountRoleArn }}"


# worker configurations
workers:
  kubernetes:
    serviceAccount:
      create: true
      annotations:
        eks.amazonaws.com/role-arn: "{{ .Values.airflowServiceAccountRoleArn }}"
    env:
      - name: PYTHONPATH
        value: /opt/airflow/dags/local-airflow-dag-init-container/python
    extraVolumes:
      - name: dags
        emptyDir: {}
    extraVolumeMounts:
      - name: dags
        mountPath: /opt/airflow/dags
        readOnly: true
    # Populate the pod-local DAG volume once before the worker starts.
    extraInitContainers:
      - name: dag-init
        image: "{{ .Values.dagInitContainerImage.repository }}:{{ .Values.dagInitContainerImage.tag }}"
        imagePullPolicy: "{{ .Values.dagInitContainerImage.pullPolicy }}"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: true
        volumeMounts:
          - name: dags
            mountPath: /opt/airflow/dags


cleanup:
  successfulJobsHistoryLimit: 3

# Database
postgresql:
  enabled: false

data:
  metadataConnection:
    db: airflow-db
  metadataSecretName: airflow-db-secret # secret is synchronized by aws-secrets-airflow
  # Prevent the chart from defensively generating a broker URL Secret. It is
  # not used by the KubernetesExecutor.
  brokerUrlSecretName: airflow-broker-url

# Redis is only required by Celery-based executors.
redis:
  enabled: false

statsd:
  annotations:
    reloader.stakater.com/auto: "true"

databaseCleanup:
  enabled: true
  retentionDays: 90
  jobAnnotations:
    reloader.stakater.com/auto: "true"

# NOTE: required for production !
pgbouncer:
  enabled: false
