[project]
name = "local-airflow-dag-init-container"
version = "0.1.0"
description = "Example Airflow DAG deployed by an init container."
requires-python = ">=3.12,<3.13"
dependencies = [
    "python-dateutil==2.9.0.post0",
]

[dependency-groups]
dev = [
    "ruff==0.14.13",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
